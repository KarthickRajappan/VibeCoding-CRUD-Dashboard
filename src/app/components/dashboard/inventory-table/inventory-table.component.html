<div class="table-container card-elevated">
  <table mat-table [dataSource]="dataSource" matSort class="inventory-table">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="gradient-table-header">
        Product Name
      </th>
      <td mat-cell *matCellDef="let item">
        <div class="product-name">{{ item.name }}</div>
      </td>
    </ng-container>

    <!-- SKU Column -->
    <ng-container matColumnDef="sku">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="gradient-table-header">
        SKU
      </th>
      <td mat-cell *matCellDef="let item">
        <span class="sku-badge">{{ item.sku }}</span>
      </td>
    </ng-container>

    <!-- Category Column -->
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="gradient-table-header">
        Category
      </th>
      <td mat-cell *matCellDef="let item">{{ item.category }}</td>
    </ng-container>

    <!-- Price Column -->
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="gradient-table-header">
        Price
      </th>
      <td mat-cell *matCellDef="let item">{{ item.price | currency }}</td>
    </ng-container>

    <!-- Quantity Column -->
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="gradient-table-header">
        Quantity
      </th>
      <td mat-cell *matCellDef="let item">
        <div class="quantity-cell">
          <span>{{ item.quantity }}</span>
          @if (getStockBadge(item); as badge) {
            <span class="stock-badge" [class]="badge.class">{{ badge.label }}</span>
          }
        </div>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="gradient-table-header actions-header">
        Actions
      </th>
      <td mat-cell *matCellDef="let item" class="actions-cell">
        <button
          mat-icon-button
          color="primary"
          matTooltip="Edit item"
          (click)="onEdit(item)"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          matTooltip="Delete item"
          (click)="onDelete(item)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      [class]="getRowClass(row)"
    ></tr>

    <!-- No data row -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data-cell" [attr.colspan]="displayedColumns.length">
        <div class="empty-state">
          <mat-icon class="empty-icon">inventory</mat-icon>
          <p>No items found</p>
        </div>
      </td>
    </tr>
  </table>

  <div class="table-footer">
    <span class="item-count">Showing {{ dataSource.data.length }} items</span>
  </div>
</div>
